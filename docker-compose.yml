services:
  api:
    build: ./api
    container_name: marrooks-todo-api
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    expose:
      - "3344"

  web:
    build: ./web
    container_name: marrooks-todo-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
